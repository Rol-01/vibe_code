    function loadFromStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : structuredClone(fallback);
      } catch (e) {
        return structuredClone(fallback);
      }
    }

    function saveToStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn('Storage unavailable', e);
      }
    }

      const icon = type === 'success' ? 'ph-check-circle text-emerald-400 dark:text-emerald-600' : 'ph-warning-circle';

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium transform translate-y-2 opacity-0 transition-all duration-300 ${colors}`;
      toast.innerHTML = `<i class="ph-fill ${icon} text-lg"></i><span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .map(part => part[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    function calculateGWA(courses, term = 'final') {
      let totalWeighted = 0;
      let totalUnits = 0;
      courses.forEach(c => {
        const grade = term === 'midterm' ? c.midterm : c.final;
        totalWeighted += grade * c.units;
        totalUnits += c.units;
      });
      return totalUnits ? (totalWeighted / totalUnits).toFixed(2) : '0.00';
    }

    function getTodayName() {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const today = days[new Date().getDay()];
      return today === 'Sunday' ? 'Wednesday' : today; // Default to Wednesday if accessed on Sunday so user sees active classes
    }

    // -------------------------------------------------------------------------
    // 3. THEME & NAVIGATION
    // -------------------------------------------------------------------------
    function initTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      if (isDark) {
        html.classList.add('dark');
        if (icon) icon.className = 'ph-fill ph-sun text-base text-amber-400';
        if (label) label.textContent = 'Light Mode';
      } else {
        html.classList.remove('dark');
        if (icon) icon.className = 'ph-fill ph-moon text-base text-brand-600';
        if (label) label.textContent = 'Dark Mode';
      }
    }

    function toggleTheme() {
      const isDark = !document.documentElement.classList.contains('dark');
      localStorage.setItem(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      applyTheme(isDark);
    }

    function toggleSidebar(open) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function updateSidebarMeta() {
      const nameEl = document.getElementById('sidebar-student-name');
      const idEl = document.getElementById('sidebar-student-id');
      const avatarEl = document.getElementById('sidebar-avatar');
      const badgeEl = document.getElementById('sidebar-unread-badge');

      const shortName = state.profile.fullName.split(' ').slice(0, 2).join(' ');
      nameEl.textContent = shortName;
      idEl.textContent = `${state.profile.studentId} • BSIT`;
      avatarEl.textContent = getInitials(state.profile.fullName);

      const unreadCount = ANNOUNCEMENTS_DATA.filter(a => !state.readAnnouncements.includes(a.id)).length;

    function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('new-task-input');
      const course = document.getElementById('new-task-course').value;
      const due = document.getElementById('new-task-due').value.trim() || 'Upcoming';
      const title = input.value.trim();
      if (!title) return;

      state.tasks.unshift({
        id: 'task-' + Date.now(),
        title,
        course,
        due,
        completed: false
      });
      saveToStorage(STORAGE_KEYS.TASKS, state.tasks);
      showToast('Task added to checklist');
      renderView();
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveToStorage(STORAGE_KEYS.TASKS, state.tasks);
        renderView();
      }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveToStorage(STORAGE_KEYS.TASKS, state.tasks);
      showToast('Task removed');
      renderView();
    }

          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 lg:pb-0">
            ${days.map(day => {
              const active = state.scheduleDayFilter === day;
              return `
                <button
                  onclick="setScheduleFilter('${day}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    active
                      ? 'bg-brand-600 text-white shadow-xs'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700'
                  }"
                >
                  ${day === 'All' ? 'Full Week (Mon–Sat)' : day}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Modality Legend -->
        <div class="flex flex-wrap items-center gap-4 px-1 text-xs font-medium text-slate-500 dark:text-slate-400">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Face-to-Face Lecture</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> Computer / Hands-on Lab</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span> Synchronous Online</span>
        </div>

        <!-- Timetable Grid -->
        <div class="grid grid-cols-1 ${state.scheduleDayFilter === 'All' ? 'md:grid-cols-2 xl:grid-cols-3' : 'max-w-3xl'} gap-5">
          ${filteredDays.map(day => {
            const classes = SCHEDULE_DATA.filter(c => c.day === day);
            return `
              <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl overflow-hidden shadow-soft flex flex-col">
                <div class="px-5 py-3.5 bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200/70 dark:border-slate-800 flex items-center justify-between">
                  <span class="font-display font-bold text-sm text-slate-900 dark:text-white">${day}</span>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/70 dark:border-slate-700">
                    ${classes.length} ${classes.length === 1 ? 'Class' : 'Classes'}
                  </span>
                </div>
                <div class="p-4 space-y-3 flex-1">
                  ${classes.map(cls => {
                    const styles = cls.modality === 'Lab'
                      ? { border: 'border-l-purple-500', badge: 'bg-purple-50 text-purple-700 dark:bg-purple-950/70 dark:text-purple-300' }
                      : cls.modality === 'Online'
                      ? { border: 'border-l-sky-500', badge: 'bg-sky-50 text-sky-700 dark:bg-sky-950/70 dark:text-sky-300' }
                      : { border: 'border-l-emerald-500', badge: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-300' };

                    return `
                      <div class="p-3.5 rounded-xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800 border-l-4 ${styles.border} hover:shadow-xs transition-all">
                        <div class="flex items-center justify-between gap-2">
                          <span class="text-xs font-extrabold tracking-wide text-brand-600 dark:text-brand-400">${cls.code}</span>
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold ${styles.badge}">${cls.modality}</span>
                        </div>
                        <h4 class="font-semibold text-sm text-slate-900 dark:text-white mt-1">${cls.title}</h4>
                        <div class="mt-2.5 pt-2.5 border-t border-slate-200/60 dark:border-slate-700/60 space-y-1 text-xs text-slate-500 dark:text-slate-400">
                          <div class="flex items-center gap-1.5 font-medium text-slate-700 dark:text-slate-300">
                            <i class="ph ph-clock text-brand-500"></i>
                            <span>${cls.start} – ${cls.end}</span>
                          </div>
                          <div class="flex items-center gap-1.5">
                            <i class="ph ph-map-pin text-slate-400"></i>
                            <span>${cls.room}</span>
                          </div>
                          <div class="flex items-center gap-1.5">
                            <i class="ph ph-user text-slate-400"></i>
                            <span>${cls.instructor}</span>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setScheduleFilter(day) {
      state.scheduleDayFilter = day;
      renderView();
    }

    // -------------------------------------------------------------------------
    // 6. MODULE 3: GRADES & GWA VIEW
    // -------------------------------------------------------------------------
    function renderGrades() {
      const semesters = Object.keys(GRADES_DATA);
      const courses = GRADES_DATA[state.selectedSemester] || [];
      const midtermGWA = calculateGWA(courses, 'midterm');
      const finalGWA = calculateGWA(courses, 'final');
      const activeGWA = state.gradeTermFilter === 'midterm' ? midtermGWA : finalGWA;
      const totalUnits = courses.reduce((acc, c) => acc + c.units, 0);

      return `
        <!-- Top Controls & GWA Summary -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-8 bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 shadow-soft flex flex-col justify-between gap-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="font-display font-bold text-xl text-slate-900 dark:text-white">Academic Grade Report</h2>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Official course standing and General Weighted Average (GWA)</p>
              </div>

              <!-- Semester Selector -->
              <div class="flex items-center gap-2">
                <select onchange="setSemester(this.value)" class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                  ${semesters.map(sem => `<option value="${sem}" ${sem === state.selectedSemester ? 'selected' : ''}>${sem}</option>`).join('')}
                </select>
              </div>
            </div>

            <!-- Midterm vs Final Toggle -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
              <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800">
                <button onclick="setGradeTerm('midterm')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${state.gradeTermFilter === 'midterm' ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-xs' : 'text-slate-600 dark:text-slate-400'}">
                  Midterm Standing
                </button>
                <button onclick="setGradeTerm('final')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${state.gradeTermFilter === 'final' ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-xs' : 'text-slate-600 dark:text-slate-400'}">
                  Final / Cumulative
                </button>
              </div>
              <span class="text-xs text-slate-500 dark:text-slate-400">Grading Scale: <strong>1.00</strong> (Highest) – <strong>3.00</strong> (Passing)</span>
            </div>
          </div>

          <!-- Calculated GWA Card -->
          <div class="lg:col-span-4 bg-gradient-to-br from-brand-600 to-indigo-800 rounded-2xl p-6 text-white shadow-soft flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">${state.gradeTermFilter === 'midterm' ? 'Midterm GWA' : 'Cumulative GWA'}</span>
              <span class="px-2.5 py-1 rounded-lg bg-white/15 text-xs font-semibold">${totalUnits} Total Units</span>
            </div>
            <div class="my-3">
              <span class="font-display font-extrabold text-4xl sm:text-5xl tracking-tight">${activeGWA}</span>
              <span class="ml-2 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-400/20 text-emerald-200 border border-emerald-300/30">
                ${parseFloat(activeGWA) <= 1.75 ? "Dean's Lister Qualified" : 'Good Standing'}
              </span>
            </div>
            <p class="text-xs text-indigo-100/80">Computed automatically via unit-weighted average.</p>
          </div>
        </div>

        <!-- Interactive Grades Table -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-soft overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200/80 dark:border-slate-800 text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  <th class="py-3.5 px-5">Course Code</th>
                  <th class="py-3.5 px-5">Course Title</th>
                  <th class="py-3.5 px-4 text-center">Units</th>
                  <th class="py-3.5 px-4 text-center">Midterm</th>
                  <th class="py-3.5 px-4 text-center">Final</th>
                  <th class="py-3.5 px-4 text-center">Equiv. %</th>
                  <th class="py-3.5 px-5 text-right">Remarks</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                ${courses.map(c => {
                  const isPassed = c.status === 'Passed';
                  return `
                    <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">
                      <td class="py-4 px-5 font-bold text-brand-600 dark:text-brand-400 whitespace-nowrap">${c.code}</td>
                      <td class="py-4 px-5 font-medium text-slate-900 dark:text-white">${c.title}</td>
                      <td class="py-4 px-4 text-center text-slate-600 dark:text-slate-300">${c.units}</td>
                      <td class="py-4 px-4 text-center font-semibold ${state.gradeTermFilter === 'midterm' ? 'text-brand-600 dark:text-brand-400' : 'text-slate-600 dark:text-slate-300'}">${c.midterm.toFixed(2)}</td>
                      <td class="py-4 px-4 text-center font-bold ${state.gradeTermFilter === 'final' ? 'text-brand-600 dark:text-brand-400' : 'text-slate-600 dark:text-slate-300'}">${c.final.toFixed(2)}</td>
                      <td class="py-4 px-4 text-center text-slate-500 dark:text-slate-400">${c.percent}%</td>
                      <td class="py-4 px-5 text-right whitespace-nowrap">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${
                          isPassed
                            ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-400'
                            : 'bg-amber-50 text-amber-700 dark:bg-amber-950/70 dark:text-amber-400'
                        }">
                          <span class="w-1.5 h-1.5 rounded-full ${isPassed ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                          ${c.status}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Visual Grade Distribution Bar Chart -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 shadow-soft">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h3 class="font-display font-bold text-base sm:text-lg text-slate-900 dark:text-white">Course Percentage Performance Distribution</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Visual comparison across enrolled courses (${state.selectedSemester})</p>
            </div>
          </div>

          <div class="space-y-4">
            ${courses.map(c => {
              const barColor = c.percent >= 95 ? 'bg-emerald-500' : c.percent >= 90 ? 'bg-brand-600' : 'bg-sky-500';
              return `
                <div>
                  <div class="flex justify-between text-xs font-semibold mb-1.5">
                    <span class="text-slate-700 dark:text-slate-200">${c.code} — ${c.title}</span>
                    <span class="text-slate-900 dark:text-white">${c.percent}% (${c.final.toFixed(2)})</span>
                  </div>
                  <div class="w-full h-3 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                    <div class="h-full rounded-full ${barColor} transition-all duration-500" style="width: ${c.percent}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setSemester(sem) {
      state.selectedSemester = sem;
      renderView();
    }

    function setGradeTerm(term) {
      state.gradeTermFilter = term;
      renderView();
    }

    // -------------------------------------------------------------------------
    // 7. MODULE 4: ANNOUNCEMENTS VIEW
    // -------------------------------------------------------------------------
    function renderAnnouncements() {
      const categories = ['All', 'Academic', 'Events', 'IT Department', 'Deadlines'];
      const query = state.announcementSearch.toLowerCase().trim();

      const filtered = ANNOUNCEMENTS_DATA.filter(ann => {
        const matchesCat = state.announcementCategory === 'All' || ann.category === state.announcementCategory;
        const matchesSearch = !query ||
          ann.title.toLowerCase().includes(query) ||
          ann.summary.toLowerCase().includes(query) ||
          ann.author.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      // Sort pinned items first
      filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      return `
        <!-- Search & Category Filter Bar -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-soft space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="font-display font-bold text-xl text-slate-900 dark:text-white">Campus & Department News</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Official advisories, IT department updates, and academic deadlines</p>
            </div>
            <!-- Search Input -->
            <div class="relative w-full md:w-72">
              <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
              <input
                type="text"
                value="${escapeHTML(state.announcementSearch)}"
                oninput="handleAnnouncementSearch(this.value)"
                placeholder="Search notices..."
                class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>
          </div>

          <!-- Category Pills -->
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            ${categories.map(cat => {
              const active = state.announcementCategory === cat;
              return `
                <button
                  onclick="setAnnouncementCategory('${cat}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    active
                      ? 'bg-brand-600 text-white shadow-xs'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700'
                  }"
                >
                  ${cat}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Announcements Feed -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          ${filtered.length === 0 ? `
            <div class="md:col-span-2 bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-12 text-center">
              <i class="ph ph-newspaper text-4xl text-slate-300 dark:text-slate-600 mb-2"></i>
              <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">No announcements matched your filter.</p>
              <button onclick="resetAnnouncementFilters()" class="mt-3 px-4 py-2 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-300 text-xs font-semibold">Reset Filters</button>
            </div>
          ` : filtered.map(ann => {
            const isRead = state.readAnnouncements.includes(ann.id);
            const catColors = {
              'Deadlines': 'bg-rose-50 text-rose-700 dark:bg-rose-950/70 dark:text-rose-300',
              'IT Department': 'bg-purple-50 text-purple-700 dark:bg-purple-950/70 dark:text-purple-300',
              'Events': 'bg-amber-50 text-amber-700 dark:bg-amber-950/70 dark:text-amber-300',
              'Academic': 'bg-brand-50 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300'
            };
            return `
              <article onclick="openAnnouncementModal('${ann.id}')" class="cursor-pointer group bg-white dark:bg-slate-900 border ${ann.pinned ? 'border-brand-300/80 dark:border-brand-800/80' : 'border-slate-200/80 dark:border-slate-800'} rounded-2xl p-6 shadow-soft hover:shadow-md hover:border-brand-400 dark:hover:border-brand-600 transition-all flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2 flex-wrap">
                      ${ann.pinned ? `
                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">
                          <i class="ph-fill ph-push-pin"></i> Pinned
                        </span>
                      ` : ''}
                      <span class="px-2.5 py-0.5 rounded-md text-[11px] font-semibold ${catColors[ann.category] || catColors['Academic']}">
                        ${ann.category}
                      </span>
                    </div>
                    <span class="text-xs text-slate-400">${ann.date}</span>
                  </div>

                  <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors leading-snug">
                    ${ann.title}
                  </h3>
                  <p class="text-sm text-slate-600 dark:text-slate-300 mt-2 line-clamp-3 leading-relaxed">
                    ${ann.summary}
                  </p>
                </div>

                <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                  <span class="text-slate-500 dark:text-slate-400 truncate max-w-[65%]">${ann.author}</span>
                  <span class="font-semibold text-brand-600 dark:text-brand-400 flex items-center gap-1">
                    ${isRead ? 'Read Again' : 'Read Notice'} <i class="ph-bold ph-arrow-right"></i>
                  </span>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    function setAnnouncementCategory(cat) {
      state.announcementCategory = cat;
      renderView();
    }

    function handleAnnouncementSearch(val) {
      state.announcementSearch = val;
      renderView();
    }

    function resetAnnouncementFilters() {
      state.announcementCategory = 'All';
      state.announcementSearch = '';
      renderView();
    }

    function openAnnouncementModal(id) {
      const ann = ANNOUNCEMENTS_DATA.find(a => a.id === id);
      if (!ann) return;

      if (!state.readAnnouncements.includes(id)) {
        state.readAnnouncements.push(id);
        saveToStorage(STORAGE_KEYS.READ_ANNOUNCEMENTS, state.readAnnouncements);
        updateSidebarMeta();
      }

      document.getElementById('modal-category').textContent = ann.category;
      document.getElementById('modal-date').textContent = ann.date;
      document.getElementById('modal-title').textContent = ann.title;
      document.getElementById('modal-author').textContent = ann.author;
      document.getElementById('modal-body').innerHTML = ann.content.map(p => `<p>${p}</p>`).join('');

      const modal = document.getElementById('announcement-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeAnnouncementModal() {
      const modal = document.getElementById('announcement-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      if (state.activeView === 'announcements') {
        renderView();
      }
    }

    // -------------------------------------------------------------------------
    // 8. MODULE 5: STUDENT PROFILE VIEW
    // -------------------------------------------------------------------------
    function renderProfile() {
      const p = state.profile;
      const initials = getInitials(p.fullName);

      return `
        <div class="max-w-4xl mx-auto space-y-6">
          <!-- Profile Header Card -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl overflow-hidden shadow-soft">
            <div class="h-32 bg-gradient-to-r from-brand-600 via-indigo-600 to-violet-700"></div>
            <div class="px-6 pb-6">
              <div class="relative flex flex-col sm:flex-row sm:items-end justify-between -mt-12 mb-4 gap-4">
                <div class="flex items-end gap-4">
                  <div class="w-24 h-24 rounded-2xl bg-slate-900 dark:bg-slate-800 border-4 border-white dark:border-slate-900 text-white font-display font-extrabold text-3xl flex items-center justify-center shadow-md">
                    ${initials}
                  </div>
                  <div class="pb-1">
                    <h2 class="font-display font-bold text-xl sm:text-2xl text-slate-900 dark:text-white">${escapeHTML(p.fullName)}</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">${escapeHTML(p.program)} • ${escapeHTML(p.yearLevel)}</p>
                  </div>
                </div>

                <span class="self-start sm:self-end inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-200/70 dark:border-emerald-800/70 text-xs font-bold">
                  <i class="ph-fill ph-seal-check text-base"></i>
                  ${escapeHTML(p.academicStanding)}
                </span>
              </div>
            </div>
          </div>

          <!-- Editable Profile Form -->
          <form onsubmit="handleSaveProfile(event)" class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-soft space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">Personal & Academic Information</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Changes are persisted locally in your browser storage</p>
              </div>
              <button type="button" onclick="handleResetProfile()" class="self-start sm:self-auto px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/70 dark:hover:bg-slate-700 transition-colors flex items-center gap-1.5">
                <i class="ph-bold ph-arrow-counter-clockwise"></i>
                <span>Reset to Default</span>
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Student ID Number</label>
                <input type="text" name="studentId" value="${escapeHTML(p.studentId)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Full Name</label>
                <input type="text" name="fullName" value="${escapeHTML(p.fullName)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Degree Program</label>
                <input type="text" name="program" value="${escapeHTML(p.program)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Year Level & Section</label>
                <input type="text" name="yearLevel" value="${escapeHTML(p.yearLevel)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Academic Advisor</label>
                <input type="text" name="academicAdvisor" value="${escapeHTML(p.academicAdvisor)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">University Email</label>
                <input type="email" name="email" value="${escapeHTML(p.email)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Mobile Number</label>
                <input type="text" name="phone" value="${escapeHTML(p.phone)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Academic Standing Badge</label>
                <input type="text" name="academicStanding" value="${escapeHTML(p.academicStanding)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Emergency Contact Person</label>
                <input type="text" name="emergencyContactName" value="${escapeHTML(p.emergencyContactName)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Emergency Contact Number</label>
                <input type="text" name="emergencyContactPhone" value="${escapeHTML(p.emergencyContactPhone)}" required class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold shadow-sm shadow-brand-600/20 transition-all flex items-center gap-2">
                <i class="ph-bold ph-floppy-disk"></i>
                <span>Save Profile Changes</span>
              </button>
            </div>
          </form>
        </div>
      `;
    }

    function handleSaveProfile(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      state.profile = {
        ...state.profile,
        studentId: formData.get('studentId').trim(),
        fullName: formData.get('fullName').trim(),
        program: formData.get('program').trim(),
        yearLevel: formData.get('yearLevel').trim(),
        academicAdvisor: formData.get('academicAdvisor').trim(),
        email: formData.get('email').trim(),
        phone: formData.get('phone').trim(),
        academicStanding: formData.get('academicStanding').trim(),
        emergencyContactName: formData.get('emergencyContactName').trim(),
        emergencyContactPhone: formData.get('emergencyContactPhone').trim()
      };
      saveToStorage(STORAGE_KEYS.PROFILE, state.profile);
      showToast('Student profile saved successfully');
      renderView();
    }

    function handleResetProfile() {
      state.profile = structuredClone(DEFAULT_PROFILE);
      saveToStorage(STORAGE_KEYS.PROFILE, state.profile);
      showToast('Profile restored to default values');
      renderView();
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // -------------------------------------------------------------------------
    // 9. INITIALIZATION ON LOAD
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Set live formatted date in top bar
      const dateEl = document.getElementById('header-current-date');
      if (dateEl) {
        dateEl.textContent = new Date().toLocaleDateString('en-US', {
          weekday: 'long',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }

      // Close modal on Escape key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAnnouncementModal();
      });

      navigateTo('dashboard');
    });
  </script>
</body>
</html>
